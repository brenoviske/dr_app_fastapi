<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <title>DoctorFlow | Criar Conta</title>
    <link rel="icon" type="image/png" href="/static/assets/DoctorFlow.png">
    <script src="https://cdn.tailwindcss.com"></script>

    <style>
        body {
            background: linear-gradient(135deg, #eef6ff, #ffffff);
        }

        @keyframes slideIn {
            0% {
                opacity: 0;
                transform: translateY(-15px);
            }
            100% {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .notification {
            animation: slideIn 0.35s ease;
        }
    </style>
</head>

<body class="flex items-center justify-center min-h-screen relative">

    <!-- Decoração de fundo -->

    <div class="absolute w-96 h-96 bg-blue-200 opacity-30 blur-3xl rounded-full top-10 left-10"></div>

    <div class="absolute w-96 h-96 bg-blue-300 opacity-20 blur-3xl rounded-full bottom-10 right-10"></div>


    <!-- Card de Cadastro -->

    <div class="bg-white/90 backdrop-blur-xl shadow-2xl rounded-2xl w-[420px] p-10 border border-blue-100">

        <!-- Título -->

        <div class="text-center mb-8">

            <h1 class="text-4xl font-bold text-blue-600">
                DoctorFlow
            </h1>

            <p class="text-gray-500 mt-1">
                Criar nova conta
            </p>

        </div>


        <!-- Formulário -->

        <form
            id="signupForm"
            class="space-y-5"
        >

            <!-- Email -->

            <div>

                <label class="text-sm text-gray-600">
                    Email
                </label>

                <input
                    type="email"
                    name="email"
                    required
                    placeholder="Digite seu email"
                    class="w-full mt-1 border border-gray-300 rounded-lg p-3 focus:outline-none focus:ring-2 focus:ring-blue-400 transition"
                >

            </div>


            <!-- Username -->

            <div>

                <label class="text-sm text-gray-600">
                    Usuário
                </label>

                <input
                    type="text"
                    name="username"
                    required
                    placeholder="Escolha um usuário"
                    class="w-full mt-1 border border-gray-300 rounded-lg p-3 focus:outline-none focus:ring-2 focus:ring-blue-400 transition"
                >

            </div>


            <!-- Password -->

            <div>

                <label class="text-sm text-gray-600">
                    Senha
                </label>

                <input
                    type="password"
                    id="password"
                    name="password"
                    required
                    placeholder="Crie uma senha"
                    class="w-full mt-1 border border-gray-300 rounded-lg p-3 focus:outline-none focus:ring-2 focus:ring-blue-400 transition"
                >

                <!-- Barra de força da senha -->

                <div class="w-full bg-gray-200 h-2 rounded mt-2">

                    <div
                        id="strengthBar"
                        class="h-2 rounded transition-all duration-300"
                        style="width:0%"
                    ></div>

                </div>

            </div>


            <!-- Confirm Password -->

            <div>

                <label class="text-sm text-gray-600">
                    Confirmar Senha
                </label>

                <input
                    type="password"
                    id="confirmPassword"
                    required
                    placeholder="Repita sua senha"
                    class="w-full mt-1 border border-gray-300 rounded-lg p-3 focus:outline-none focus:ring-2 focus:ring-blue-400 transition"
                >

            </div>


            <!-- Botão -->

            <button
                id="signupButton"
                type="submit"
                class="w-full bg-blue-600 text-white py-3 rounded-lg font-semibold hover:bg-blue-700 transition"
            >
                Criar Conta
            </button>

        </form>


        <!-- Link Login -->

        <div class="text-center mt-6 text-sm">

            <a
                href="/first-access"
                class="text-blue-600 hover:underline"
            >
                Já tenho uma conta
            </a>

        </div>


        <!-- Notificação -->

        <div
            id="notification"
            class="hidden notification mt-6 text-center text-sm font-semibold p-3 rounded-lg"
        ></div>

    </div>



<script>

const passwordInput = document.getElementById("password")
const confirmInput = document.getElementById("confirmPassword")
const strengthBar = document.getElementById("strengthBar")
const form = document.getElementById("signupForm")
const notification = document.getElementById("notification")
const button = document.getElementById("signupButton")


/* Avaliação da força da senha */

passwordInput.addEventListener("input", function(){

    const value = passwordInput.value
    let score = 0

    if(value.length >= 6) score++
    if(/[A-Z]/.test(value)) score++
    if(/[0-9]/.test(value)) score++
    if(/[^A-Za-z0-9]/.test(value)) score++

    const percentage = score * 25
    strengthBar.style.width = percentage + "%"

    if(score <= 1){
        strengthBar.className = "h-2 bg-red-500 rounded transition-all duration-300"
    }
    else if(score == 2){
        strengthBar.className = "h-2 bg-orange-500 rounded transition-all duration-300"
    }
    else if(score == 3){
        strengthBar.className = "h-2 bg-yellow-400 rounded transition-all duration-300"
    }
    else{
        strengthBar.className = "h-2 bg-green-500 rounded transition-all duration-300"
    }

})


/* Envio AJAX */

form.addEventListener("submit", async function(event){

    event.preventDefault()

    if(passwordInput.value !== confirmInput.value){

        notification.classList.remove("hidden")
        notification.className =
            "notification mt-6 text-center text-sm font-semibold p-3 rounded-lg bg-red-100 text-red-700"

        notification.innerText = "As senhas não coincidem."
        return
    }

    button.innerText = "Criando conta..."
    button.disabled = true

    const formData = new FormData(form)

    const response = await fetch("/users/add", {
        method: "POST",
        body: formData
    })

    const data = await response.json()

    notification.classList.remove("hidden")

    if(data.status === "success"){

        notification.className =
            "notification mt-6 text-center text-sm font-semibold p-3 rounded-lg bg-green-100 text-green-700"

        notification.innerText = "Conta criada com sucesso!"

        setTimeout(function(){
            window.location.href = "/first-access"
        }, 100)

    }
    else{

        notification.className =
            "notification mt-6 text-center text-sm font-semibold p-3 rounded-lg bg-red-100 text-red-700"

        notification.innerText = data.message || "Erro ao criar conta."

    }

    button.innerText = "Criar Conta"
    button.disabled = false

})

</script>

</body>
</html>
