<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <title>DoctorFlow | Sistema Clínico</title>
    <link rel="icon" type="image/png" href="/static/assets/DoctorFlow.png">
    <script src="https://cdn.tailwindcss.com"></script>

    <style>
        body {
            background: linear-gradient(135deg, #eef6ff, #ffffff);
        }

        @keyframes float {
            0% {
                transform: translateY(0px);
            }
            50% {
                transform: translateY(-10px);
            }
            100% {
                transform: translateY(0px);
            }
        }

        @keyframes slideIn {
            0% {
                opacity: 0;
                transform: translateY(-15px);
            }
            100% {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .card-animation {
            animation: float 6s ease-in-out infinite;
        }

        .notification {
            animation: slideIn 0.35s ease;
        }
    </style>
</head>

<body class="flex items-center justify-center min-h-screen relative">

    <!-- Background Decorative Shapes -->

    <div class="absolute w-96 h-96 bg-blue-200 opacity-30 blur-3xl rounded-full top-10 left-10"></div>

    <div class="absolute w-96 h-96 bg-blue-300 opacity-20 blur-3xl rounded-full bottom-10 right-10"></div>


    <!-- Login Card -->

        <div class="card-animation bg-white/90 backdrop-blur-xl shadow-2xl rounded-2xl w-[420px] p-10 border border-blue-100">

            <!-- Logo / Title -->

            <div class="text-center mb-8">
                <h1 class="text-4xl font-bold text-blue-600">
                    DoctorFlow
                </h1>

                <p class="text-gray-500 mt-1">
                    Sistema de Gestão para Clínicas
                </p>
            </div>


            <!-- Login Form -->

            <form
                id="loginForm"
                class="space-y-5"
            >

                <!-- Email -->

                <div>
                    <label class="text-sm text-gray-600">
                        Email
                    </label>

                    <input
                        type="email"
                        name="email"
                        required
                        placeholder="Digite seu email"
                        class="w-full mt-1 border border-gray-300 rounded-lg p-3 focus:outline-none focus:ring-2 focus:ring-blue-400 transition"
                    >
                </div>


                <!-- Password -->

                <div>
                    <label class="text-sm text-gray-600">
                        Senha
                    </label>

                    <input
                        type="password"
                        name="password"
                        required
                        placeholder="Digite sua senha"
                        class="w-full mt-1 border border-gray-300 rounded-lg p-3 focus:outline-none focus:ring-2 focus:ring-blue-400 transition"
                    >
                </div>


                <!-- Login Button -->

                <button
                    id="loginButton"
                    type="submit"
                    class="w-full bg-blue-600 text-white py-3 rounded-lg font-semibold hover:bg-blue-700 transition"
                >
                    Entrar
                </button>
            </form>


            <!-- Links -->

            <div class="flex justify-between text-sm mt-6">

                <a
                    href="/signup"
                    class="text-blue-600 hover:underline"
                >
                    Criar conta
                </a>

                <a
                    href="/recover"
                    class="text-blue-600 hover:underline"
                >
                    Esqueci minha senha
                </a>

            </div>


            <!-- Notification -->

            <div
                id="notification"
                class="hidden notification mt-6 text-center text-sm font-semibold p-3 rounded-lg"
            ></div>

        </div>



<script>

    const form = document.getElementById("loginForm")
    const notification = document.getElementById("notification")
    const button = document.getElementById("loginButton")

    form.addEventListener("submit", async function(event) {

        event.preventDefault()

        button.innerText = "Entrando..."
        button.disabled = true

        const formData = new FormData(form)

        const response = await fetch("/users/login", {
            method: "POST",
            body: formData
        })

        const data = await response.json()

        notification.classList.remove("hidden")

        if (data.status === "success") {

            notification.className =
                "notification mt-6 text-center text-sm font-semibold p-3 rounded-lg bg-green-100 text-green-700"

            notification.innerText = "Login realizado com sucesso!"

            setTimeout(function () {
                window.location.href = "/main"
            }, 500)

        }
        else if (data.status === 'expired'){

            // Redirecting to the billing page right here

            setTimeout(function() {
                window.location.href = '/billing'
            }, 500)
        }

        else {

            notification.className =
                "notification mt-6 text-center text-sm font-semibold p-3 rounded-lg bg-red-100 text-red-700"

            notification.innerText = data.message || "Erro no login"

        }

        button.innerText = "Entrar"
        button.disabled = false

    })

</script>

</body>
</html>
