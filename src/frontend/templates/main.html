<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <title>DoctorFlow | Dashboard</title>
    <link rel="icon" type="image/png" href="/static/assets/DoctorFlow.png">
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gradient-to-br from-[#eef6ff] to-[#ffffff] relative min-h-screen overflow-x-hidden font-sans text-gray-800">

    <!-- Decorative background blobs behind everything -->
    <div class="absolute top-[-10%] left-[-10%] w-[30rem] h-[30rem] bg-blue-300 opacity-20 blur-[100px] rounded-full pointer-events-none z-[-1]"></div>
    <div class="absolute bottom-[-10%] right-[-5%] w-[35rem] h-[35rem] bg-indigo-300 opacity-10 blur-[120px] rounded-full pointer-events-none z-[-1]"></div>

    <!-- HEADER -->
    <header class="sticky top-0 z-50 bg-white/80 backdrop-blur-md border-b border-slate-200 px-6 py-2.5">
        <nav class="flex items-center justify-between max-w-7xl mx-auto">

            <div class="flex items-center gap-6">
                <button id="menuButton" class="p-2 hover:bg-slate-100 rounded-lg transition-colors text-slate-600">
                    <span class="text-xl">☰</span>
                </button>

            <div class="flex flex-col">
                <h1 class="text-sm font-medium text-slate-500 uppercase tracking-tight">Painel de Controle</h1>
                <p class="text-base font-bold text-slate-900 leading-tight">
                    Olá, {{ user.username }}
                </p>
            </div>
        </div>

        <div class="flex items-center gap-3">

            <div class="hidden sm:flex items-center px-3 py-1.5 rounded-full bg-slate-100 border border-slate-200">
                <div class="w-1.5 h-1.5 rounded-full bg-blue-500 mr-2 animate-pulse"></div>
                <span class="text-xs font-bold text-slate-700 uppercase tracking-wider">
                    {{ plan }}
                </span>
            </div>

            <a href="/billing" class="inline-flex items-center justify-center px-4 py-2 text-[10px] font-black uppercase tracking-[0.15em] text-white bg-gradient-to-r from-emerald-600 to-green-500 hover:from-emerald-500 hover:to-green-400 transition-all duration-300 rounded-md shadow-sm hover:shadow-md hover:-translate-y-0.5 active:translate-y-0">
                Upgrade
            </a>

            </div>
        </nav>
    </header>


    <!-- SIDEBAR -->
    <aside id="sidebar" class="fixed inset-y-0 left-0 w-64 bg-slate-900 text-slate-300 transform -translate-x-full transition-transform duration-300 ease-in-out z-50">
        <div class="p-6 border-b border-slate-800 flex justify-between items-center">
            <span class="font-black text-xl text-white">Doctor<span class="text-blue-500">Flow</span></span>
            <button id="closeSidebar" class="text-slate-500 hover:text-white">✕</button>
        </div>
        <nav class="p-4 space-y-1">
            <a href="/profile" class="block px-4 py-3 text-sm font-bold hover:bg-blue-600 hover:text-white rounded-xl transition-all">Perfil</a>
            <a href="/dashboard" class="block px-4 py-3 text-sm font-bold hover:bg-blue-600 hover:text-white rounded-xl transition-all">Dashboard</a>
            <a href="/finance" class="block px-4 py-3 text-sm font-bold hover:bg-blue-600 hover:text-white rounded-xl transition-all">Financeiro</a>

        </nav>
        <div class="absolute bottom-8 w-full px-8 text-center">
            <a href="/logout" class="text-xs font-bold text-rose-400 hover:text-rose-300 uppercase tracking-widest">Logout</a>
        </div>
    </aside>


    <!-- MAIN CONTENT -->
    <main class="p-8 relative z-10 max-w-7xl mx-auto animate-[slideIn_0.5s_ease-out]">

        <div class="flex items-center justify-between mb-8 pb-4 border-b border-gray-200">
            <div>
                <h2 class="text-3xl font-bold text-gray-800 tracking-tight">Gestão de Pacientes</h2>
                <p class="text-gray-500 mt-1">Busque, filtre e adicione novos pacientes.</p>
            </div>

            <div class="flex items-center gap-4">
                <!-- SEARCH -->
                <div class="relative group">
                    <svg class="w-5 h-5 text-gray-400 absolute left-3 top-1/2 transform -translate-y-1/2 group-focus-within:text-blue-500 transition-colors" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path></svg>
                    <input
                        id="searchInput"
                        type="text"
                        placeholder="Buscar por nome ou CPF..."
                        class="pl-10 pr-4 py-3 bg-white/70 backdrop-blur-md border border-gray-200 rounded-xl w-72 focus:outline-none focus:ring-2 focus:ring-blue-400 focus:bg-white transition-all shadow-sm"
                    >
                </div>

                <button
                    id="filterBtn"
                    class="bg-white/70 backdrop-blur-md border border-gray-200 text-gray-700 px-4 py-3 rounded-xl hover:bg-white hover:text-blue-600 hover:border-blue-200 transition-all shadow-sm flex items-center gap-2"
                >
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 4a1 1 0 011-1h16a1 1 0 011 1v2.586a1 1 0 01-.293.707l-6.414 6.414a1 1 0 00-.293.707V17l-4 4v-6.586a1 1 0 00-.293-.707L3.293 7.293A1 1 0 013 6.586V4z"></path></svg>
                    Filtros
                </button>

                <!-- CREATE PATIENT BUTTON -->
                <button
                    id="createPatientBtn"
                    class="bg-blue-600 text-white px-5 py-3 rounded-xl hover:bg-blue-700 shadow-md hover:shadow-lg transition-all flex items-center gap-2 font-medium"
                >
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"></path></svg>
                    Novo Paciente
                </button>
            </div>

        </div>

        <!-- PATIENT LIST -->
        <div
            id="patientsContainer"
            class="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-3 gap-6 w-full"
        >
        </div>

    </main>



    <!-- CREATE PATIENT MODAL -->
    <div
        id="createModal"
        class="hidden fixed inset-0 bg-black bg-opacity-40 flex items-center justify-center z-50"
    >

        <div class="bg-white w-[700px] p-8 rounded-xl">

            <h2 class="text-xl font-bold mb-6">
                Novo Paciente
            </h2>

            <form
                id="createPatientForm"
                class="grid grid-cols-2 gap-4"
            >

                <input name="name" placeholder="Nome" class="border p-2 rounded w-full" required>
                <input name="cpf" placeholder="CPF" class="border p-2 rounded w-full" required>
                <input name="age" placeholder="Idade" class="border p-2 rounded w-full" required>
                <input name="phone" placeholder="Telefone" class="border p-2 rounded w-full" required>

                <!-- Making it here the area for patient select status -->

                <select
                class="border p-2 rounded w-full"
                name="status">
                    <!-- Making here the select options -->
                    <option value="Confirmado">Confirmado</option>
                    <option value="Pendente">Pendente</option>
                    <option value="Cancelado"> Cancelado</option>

                </select>
                <input
                    name="amount"
                    placeholder="Total a pagar"
                    class="border p-2 rounded w-full"
                >

                <input
                    name="appointment"
                    placeholder="Data a se agendar o paciente"
                    class="border p-2 rounded w-full">

                <select
                    name="modality"
                    class="border p-2 rounded w-full">
                    <option value="" disabled selected>Selecionar Modalidade</option>
                    <option value="Consulta">Consulta</option>
                    <option value="Cirurgia">Cirurgia</option>
                </select>

                <textarea
                    name="note"
                    placeholder="Observações"
                    class="border p-2 rounded col-span-2 w-full"
                ></textarea>

                <button
                    type="submit"
                    class="bg-blue-600 text-white py-2 rounded col-span-2 w-full mt-2"
                >
                    Criar Paciente
                </button>

                <button type="button" id="cancelCreation"
                        class="bg-red-600 py-2 text-white rounded col-span-2 w-full"> Cancelar  </button>

            </form>

            <!-- Notification Toast Message -->
            <div id="createPatientMessage" class="mt-4 p-3 rounded-lg text-sm text-center font-medium opacity-0 transform translate-y-4 transition-all duration-300 pointer-events-none hidden">
                <!-- Message content will be injected here -->
            </div>

        </div>

    </div>



<script>

    /* SIDEBAR */
    let allPatients = []
    const sidebar = document.getElementById("sidebar")
    const menuButton = document.getElementById("menuButton")
    const closesidebar = document.getElementById('closeSidebar')
    const closeEditBtn = document.getElementById("cancelCreation")

    menuButton.onclick = () => {
        sidebar.classList.toggle("-translate-x-full")
    }

    closesidebar.onclick = () => {
        sidebar.classList.add('-translate-x-full')
    }



    /* OPEN CREATE MODAL */

    const modal = document.getElementById("createModal")
    const openBtn = document.getElementById("createPatientBtn")
    const closeBtn = document.getElementById("cancelCreation")

    openBtn.onclick = () => {
        modal.classList.remove("hidden")
        
        // Reset the message whenever we open the modal
        const messageBox = document.getElementById("createPatientMessage")
        messageBox.className = "mt-4 p-3 rounded-lg text-sm text-center font-medium opacity-0 transform translate-y-4 transition-all duration-300 pointer-events-none hidden"
        messageBox.innerText = ""
        
        document.getElementById("createPatientForm").reset()
    }

    closeBtn.onclick = () => {
        modal.classList.add("hidden")
    }



    /* CREATE PATIENT */

    document
        .getElementById("createPatientForm")
        .addEventListener("submit", async (event) => {

            event.preventDefault()

            const formData = new FormData(event.target)

            const response = await fetch("/patients/add", {
                method: "POST",
                body: formData,
                credentials: "include"
            })

            const data = await response.json()
            
            const messageBox = document.getElementById("createPatientMessage")
            messageBox.classList.remove("hidden")
            
            // Force a reflow to restart CSS animation properly
            void messageBox.offsetWidth

            if (data.status === "success") {

                messageBox.className = "mt-4 p-3 rounded-lg text-sm text-center font-medium opacity-100 transform translate-y-0 transition-all duration-300 bg-green-100 text-green-700"
                messageBox.innerText = data.message || "Paciente criado com sucesso!"

                allPatients.push(data.patient)
                renderPatients(allPatients)
                
                // Keep the success message visible briefly before closing
                setTimeout(() => {
                    modal.classList.add("hidden")
                }, 500)

            } else {
                
                messageBox.className = "mt-4 p-3 rounded-lg text-sm text-center font-medium opacity-100 transform translate-y-0 transition-all duration-300 bg-red-100 text-red-700 border border-red-200"
                messageBox.innerText = data.message || "Ocorreu um erro ao criar paciente."
                
            }

        })

        function renderPatients(patients){
            const container = document.getElementById("patientsContainer")

            container.innerHTML = ""

            if(patients.length === 0){

            container.innerHTML = `
                <div class="col-span-full bg-white/50 backdrop-blur-sm p-12 rounded-2xl border border-dashed border-gray-300 text-center flex flex-col items-center justify-center min-h-[300px]">
                    <div class="w-16 h-16 bg-gray-100 rounded-full flex items-center justify-center text-gray-400 mb-4">
                        <svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9.172 16.172a4 4 0 015.656 0M9 10h.01M15 10h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                    </div>
                    <h3 class="text-xl font-bold text-gray-700 mb-1">Nenhum paciente encontrado</h3>
                    <p class="text-gray-500">Tente ajustar seus termos de busca ou filtros.</p>
                </div>
            `
            return
        }

        patients.forEach(patient => renderPatientCard(patient))
    }



    /* RENDER PATIENT CARD */

    function renderPatientCard(patient) {

        const container = document.getElementById("patientsContainer")

        const card = document.createElement("div")

        card.className =
            "bg-white/80 backdrop-blur-xl rounded-2xl shadow-[0_2px_15px_-3px_rgba(0,0,0,0.07),0_10px_20px_-2px_rgba(0,0,0,0.04)] border border-white/60 p-6 hover:-translate-y-1 hover:shadow-xl transition-all duration-300 flex flex-col group relative overflow-hidden"

        const getStatusBadge = (status) => {
            if (!status) return "";
            const s = status.toLowerCase();
            if (s.includes("confirmado")) return `<span class="inline-flex items-center px-2.5 py-0.5 rounded-full text-xs font-semibold bg-green-100 text-green-800 border border-green-200"><span class="w-1.5 h-1.5 rounded-full bg-green-500 mr-1.5"></span>Confirmado</span>`;
            if (s.includes("pendente")) return `<span class="inline-flex items-center px-2.5 py-0.5 rounded-full text-xs font-semibold bg-amber-100 text-amber-800 border border-amber-200"><span class="w-1.5 h-1.5 rounded-full bg-amber-500 mr-1.5"></span>Pendente</span>`;
            if (s.includes("cancelado")) return `<span class="inline-flex items-center px-2.5 py-0.5 rounded-full text-xs font-semibold bg-red-100 text-red-800 border border-red-200"><span class="w-1.5 h-1.5 rounded-full bg-red-500 mr-1.5"></span>Cancelado</span>`;
            return `<span class="inline-flex items-center px-2.5 py-0.5 rounded-full text-xs font-semibold bg-gray-100 text-gray-800 border border-gray-200">${status}</span>`;
        };

        const fields = `
            ${patient.status ? `<div class="absolute top-6 right-6">${getStatusBadge(patient.status)}</div>` : ""}
            <div class="space-y-3 mt-4">
                ${patient.cpf ? `
                <div class="flex items-center text-sm text-gray-600">
                    <svg class="w-4 h-4 mr-2 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 6H5a2 2 0 00-2 2v9a2 2 0 002 2h14a2 2 0 002-2V8a2 2 0 00-2-2h-5m-4 0V5a2 2 0 114 0v1m-4 0a2 2 0 104 0m-5 8a2 2 0 100-4 2 2 0 000 4zm0 0c1.306 0 2.417.835 2.83 2M9 14a3.001 3.001 0 00-2.83 2M15 11h3m-3 4h2"></path></svg>
                    <span class="font-medium mr-1 text-gray-500">CPF:</span> ${patient.cpf}
                </div>` : ""}
                
                ${patient.phone ? `
                <div class="flex items-center text-sm text-gray-600">
                    <svg class="w-4 h-4 mr-2 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 5a2 2 0 012-2h3.28a1 1 0 01.948.684l1.498 4.493a1 1 0 01-.502 1.21l-2.257 1.13a11.042 11.042 0 005.516 5.516l1.13-2.257a1 1 0 011.21-.502l4.493 1.498a1 1 0 01.684.949V19a2 2 0 01-2 2h-1C9.716 21 3 14.284 3 6V5z"></path></svg>
                    <span class="font-medium mr-1 text-gray-500">Tel:</span> ${patient.phone}
                </div>` : ""}
                
                <div class="grid grid-cols-2 gap-4 mt-2 mb-4">
                    ${patient.age ? `
                    <div class="bg-gray-50/50 rounded-lg p-2 border border-gray-100 flex items-center justify-between">
                        <span class="block text-xs text-gray-500 font-semibold uppercase tracking-wider">Idade</span>
                        <span class="font-medium text-gray-800">${patient.age}</span>
                    </div>` : ""}
                    
                    ${patient.amount ? `
                    <div class="bg-blue-50/50 rounded-lg p-2 border border-blue-100 flex items-center justify-between">
                        <span class="block text-xs text-blue-500 font-semibold uppercase tracking-wider">A pagar</span>
                        <span class="font-bold text-blue-700">R$ ${patient.amount}</span>
                    </div>` : ""}
                </div>

                <div class="grid grid-cols-2 gap-4 mt-3 mb-4">

                    ${patient.appointment ? `
                    <div class="bg-gray-50/50 rounded-lg p-2 border border-gray-100 flex flex-col items-center justify-center">
                        <span class="block text-[10px] text-gray-500 font-semibold uppercase tracking-wider">Agedamento</span>
                        <span class="font-medium text-gray-800 text-center text-sm">${patient.appointment}</span>
                    </div>` : ""}

                    ${patient.modality ? `
                    <div class="bg-blue-50/50 rounded-lg p-2 border border-blue-100 flex flex-col items-center justify-center">
                        <span class="block text-[10px] text-blue-500 font-semibold uppercase tracking-wider">Modalidade</span>
                        <span class="font-bold text-blue-700 capitalize">${patient.modality}</span>
                    </div>` : ""}

                </div>


                ${patient.note ? `
                <div class="mt-4 p-4 bg-amber-50/40 border border-amber-200/60 rounded-xl text-sm text-gray-700 h-28 overflow-y-auto custom-scrollbar shadow-inner relative">

                    <p class="leading-relaxed whitespace-pre-wrap">${patient.note}</p>
                </div>` : ""}
            </div>
        `
        card.innerHTML = `

            <div class="flex-1">

                <div class="flex items-center gap-3">
                    <div class="w-10 h-10 rounded-full bg-gradient-to-tr from-blue-500 to-indigo-500 text-white flex items-center justify-center font-bold text-lg shadow-md flex-shrink-0">
                        ${patient.name ? patient.name.substring(0, 2).toUpperCase() : '?'}
                    </div>
                    <h3 class="text-xl font-bold text-gray-800 truncate pr-24">
                        ${patient.name}
                    </h3>
                </div>

                <div class="mt-4">
                    ${fields}
                </div>

            </div>

            <div class="flex gap-2 mt-6 pt-4 border-t border-gray-100">

                <button
                    class="flex-1 bg-white border border-gray-200 text-gray-700 px-4 py-2.5 rounded-xl hover:bg-gray-50 hover:text-blue-600 hover:border-blue-200 transition-all text-sm font-medium flex justify-center items-center gap-1.5 focus:outline-none focus:ring-2 focus:ring-blue-100"
                    onclick='editPatient(${JSON.stringify(patient).replace(/'/g, "&apos;")})'
                >
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z"></path></svg>
                    Editar
                </button>

                <button
                    class="flex-1 bg-white border border-gray-200 text-gray-700 px-4 py-2.5 rounded-xl hover:bg-red-50 hover:text-red-600 hover:border-red-200 transition-all text-sm font-medium flex justify-center items-center gap-1.5 focus:outline-none focus:ring-2 focus:ring-red-100"
                    onclick="deletePatient(${patient.id})"
                >
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path></svg>
                    Deletar
                </button>

            </div>

        `

        container.appendChild(card)

    }



    /* DELETE PATIENT */

    async function deletePatient(id) {

    const response = await fetch(`/patients/delete?patient_id=${id}`, {
        method: "DELETE",
        credentials : "include"

    })

    const data = await response.json()

    if (data.status === "success") {
        location.reload()
    } else {
        alert(data.message)
    }
}



    /* EDIT PATIENT MODAL (DYNAMIC) */


    function editPatient(patient) {

        const modalHTML = `

        <div id="editModal" class="fixed inset-0 bg-black bg-opacity-40 flex items-center justify-center z-50">

            <div class="bg-white w-[700px] p-8 rounded-xl">

                <h2 class="text-xl font-bold mb-6">
                    Editar Paciente
                </h2>

                <form id="editPatientForm" class="grid grid-cols-2 gap-4">

                    <input type="hidden" name="id" value="${patient.id}">

                    <input name="name" value="${patient.name || ""}" class="border p-2 rounded w-full" placeholder="Nome">
                    <input name="cpf" value="${patient.cpf || ""}" class="border p-2 rounded w-full" placeholder="CPF do paciente">
                    <input name="age" value="${patient.age || ""}" class="border p-2 rounded w-full" placeholder="Idade do paciente">
                    <input name="phone" value="${patient.phone || ""}" class="border p-2 rounded w-full" placeholder="Telefone(Somente Números)">
                    
                    <select name="status" class="border p-2 rounded w-full">
                        <option value="Confirmado" ${patient.status === 'Confirmado' ? 'selected' : ''}>Confirmado</option>
                        <option value="Pendente" ${patient.status === 'Pendente' ? 'selected' : ''}>Pendente</option>
                        <option value="Cancelado" ${patient.status === 'Cancelado' ? 'selected' : ''}>Cancelado</option>
                    </select>

                    <input name="amount" type="number" value="${patient.amount || ""}" class="border p-2 rounded w-full" placeholder="Total a pagar">
                    <input name="appointment" value="${patient.appointment || ""}" class="border p-2 rounded w-full" placeholder="Data a se agendar o paciente">
                    
                    <select name="modality" class="border p-2 rounded w-full">
                        <option value="" ${!patient.modality ? 'selected' : ''} disabled>Selecionar Modalidade</option>
                        <option value="Consulta" ${patient.modality === 'Consulta' ? 'selected' : ''}>Consulta</option>
                        <option value="Cirurgia" ${patient.modality === 'Cirurgia' ? 'selected' : ''}>Cirurgia</option>
                    </select>

                    <textarea
                        name="note"
                        class="border p-2 rounded col-span-2 w-full"
                        placeholder="Nota do paciente"
                    >${patient.note || ""}</textarea>

                    <button
                        type="submit"
                        class="bg-blue-600 text-white py-2 rounded col-span-2 w-full mt-2"
                    >
                        Salvar Alterações
                    </button>

                    <button
                        type="button"
                        onclick="document.getElementById('editModal').remove()"
                        class="bg-red-600 text-white py-2 rounded col-span-2 w-full"
                    > Cancelar</button>
                </form>

            </div>

        </div>
        `

        document.body.insertAdjacentHTML("beforeend", modalHTML)

        document
    .getElementById("editPatientForm")
    .addEventListener("submit", async (event) => {

        event.preventDefault()

        const formData = new FormData(event.target)

        const patient_id = formData.get("id")

        const response = await fetch(`/patients/update?patient_id=${patient_id}`, {
            method: "PUT",
            body: formData,
            credentials: "include"
        })

        const data = await response.json()

        if (data.status === "success") {
            location.reload()
        } else {
            alert(data.message)
        }

})
    }

    const filterBtn = document.getElementById("filterBtn")

filterBtn.onclick = () => {

    const modal = `
    <div id="filterModal" class="fixed inset-0 bg-black bg-opacity-40 flex items-center justify-center z-50">

        <div class="bg-white/95 backdrop-blur-xl shadow-2xl w-[500px] p-8 rounded-2xl border border-blue-50">

            <h2 class="text-2xl font-bold mb-6 text-gray-800 flex items-center gap-2">
                <svg class="w-6 h-6 text-blue-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 4a1 1 0 011-1h16a1 1 0 011 1v2.586a1 1 0 01-.293.707l-6.414 6.414a1 1 0 00-.293.707V17l-4 4v-6.586a1 1 0 00-.293-.707L3.293 7.293A1 1 0 013 6.586V4z"></path></svg>
                Filtros
            </h2>

            <div class="space-y-5">

                <div>
                    <label class="block text-sm font-medium text-gray-600 mb-1">Status</label>
                    <select id="statusFilter" class="w-full border border-gray-300 rounded-lg p-3 focus:outline-none focus:ring-2 focus:ring-blue-400 focus:border-transparent transition">
                        <option value="">Todos</option>
                        <option value="Confirmado">Confirmado</option>
                        <option value="Pendente">Pendente</option>
                        <option value="Cancelado">Cancelado</option>
                    </select>
                </div>

                <div>
                    <label class="block text-sm font-medium text-gray-600 mb-1">Idade mínima</label>
                    <input id="minAge" type="number" class="w-full border border-gray-300 rounded-lg p-3 focus:outline-none focus:ring-2 focus:ring-blue-400 focus:border-transparent transition">
                </div>

                <div>
                    <label class="block text-sm font-medium text-gray-600 mb-1">Idade máxima</label>
                    <input id="maxAge" type="number" class="w-full border border-gray-300 rounded-lg p-3 focus:outline-none focus:ring-2 focus:ring-blue-400 focus:border-transparent transition">
                </div>

                <div class="flex gap-3 pt-4">
                    <button id="closeFilter" class="flex-1 bg-white border border-gray-300 text-gray-700 py-3 px-6 rounded-xl hover:bg-gray-50 transition font-medium">
                        Cancelar
                    </button>
                    <button id="applyFilters" class="flex-1 bg-blue-600 text-white py-3 px-6 rounded-xl hover:bg-blue-700 transition font-medium shadow-md hover:shadow-lg">
                        Aplicar
                    </button>
                </div>

            </div>

        </div>

    </div>
    `

    document.body.insertAdjacentHTML("beforeend", modal)

    document.getElementById("closeFilter").onclick = () => {
        document.getElementById("filterModal").remove()
    }

    document.getElementById("applyFilters").onclick = () => {

        const status = document.getElementById("statusFilter").value
        const minAgeValue = document.getElementById("minAge").value
        const maxAgeValue = document.getElementById("maxAge").value

        const filtered = allPatients.filter(patient => {

            let valid = true

            // Use robust string checking to ignore case and trailing spaces
            if (status) {
                const patientStatus = (patient.status || "").toLowerCase().trim()
                const filterStatus = status.toLowerCase().trim()
                
                if (patientStatus !== filterStatus) {
                    valid = false
                }
            }

            // Convert string age to integer properly before comparison
            const patientAge = parseInt(patient.age) || 0

            if(minAgeValue && patientAge < parseInt(minAgeValue)){
                valid = false
            }

            if(maxAgeValue && patientAge > parseInt(maxAgeValue)){
                valid = false
            }

            return valid

        })

        renderPatients(filtered)

        document.getElementById("filterModal").remove()

    }

}

    const searchInput = document.getElementById("searchInput")

    searchInput.addEventListener("input", () => {

        const query = searchInput.value.toLowerCase().trim()

        const filtered = allPatients.filter(patient => {

        const nameMatch = patient.name?.toLowerCase().includes(query)
        const cpfMatch = patient.cpf?.toLowerCase().includes(query)

        return nameMatch || cpfMatch

    })

    renderPatients(filtered)
    })

    /* LOAD PATIENTS */

    window.onload = async () => {

        const response = await fetch("/patients/all", {
            credentials: "include"
        })

        const patients = await response.json()

        allPatients = patients
        renderPatients(allPatients)

    }

</script>

</body>
</html>
