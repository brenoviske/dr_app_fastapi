<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <title>DoctorFlow | Redefinir Senha</title>

    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="icon" type="image/png" href="/static/assets/DoctorFlow.png">

    <style>
        body {
            background: linear-gradient(135deg, #eef6ff, #ffffff);
        }

        @keyframes float {
            0% {
                transform: translateY(0);
            }
            50% {
                transform: translateY(-10px);
            }
            100% {
                transform: translateY(0);
            }
        }

        @keyframes slideIn {
            0% {
                opacity: 0;
                transform: translateY(-15px);
            }
            100% {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .card-animation {
            animation: float 6s ease-in-out infinite;
        }

        .notification {
            animation: slideIn .35s ease;
        }
    </style>
</head>

<body class="flex items-center justify-center min-h-screen relative">

    <!-- Background shapes -->

    <div class="absolute w-96 h-96 bg-blue-200 opacity-30 blur-3xl rounded-full top-10 left-10"></div>
    <div class="absolute w-96 h-96 bg-blue-300 opacity-20 blur-3xl rounded-full bottom-10 right-10"></div>


    <!-- Card -->

    <div class="card-animation bg-white/90 backdrop-blur-xl shadow-2xl rounded-2xl w-[420px] p-10 border border-blue-100">

        <div class="text-center mb-8">

            <h1 class="text-4xl font-bold text-blue-600">
                DoctorFlow
            </h1>

            <p class="text-gray-500 mt-1">
                Redefinir senha da conta
            </p>

        </div>


        <form id="passwordForm" class="space-y-5">

            <input type="hidden" name="token" value="{{ token }}">
            <!-- Password -->

            <div>

                <label class="text-sm text-gray-600">
                    Nova senha
                </label>

                <input
                    type="password"
                    name="password"
                    id="password"
                    required
                    placeholder="Digite a nova senha"
                    class="w-full mt-1 border border-gray-300 rounded-lg p-3 focus:outline-none focus:ring-2 focus:ring-blue-400 transition"
                />

                <!-- Strength bar -->

                <div class="mt-2 w-full bg-gray-200 rounded-full h-2">
                    <div
                        id="strengthBar"
                        class="h-2 rounded-full transition-all"
                    ></div>
                </div>

                <p
                    id="strengthText"
                    class="text-xs mt-1 text-gray-500"
                ></p>

            </div>


            <!-- Confirm password -->

            <div>

                <label class="text-sm text-gray-600">
                    Confirmar senha
                </label>

                <input
                    type="password"
                    id="confirmPassword"
                    required
                    placeholder="Confirme a senha"
                    class="w-full mt-1 border border-gray-300 rounded-lg p-3 focus:outline-none focus:ring-2 focus:ring-blue-400 transition"
                />

                <p
                    id="matchText"
                    class="text-xs mt-1"
                ></p>

            </div>


            <button
                id="submitButton"
                type="submit"
                class="w-full bg-blue-600 text-white py-3 rounded-lg font-semibold hover:bg-blue-700 transition"
            >
                Redefinir senha
            </button>

        </form>


        <!-- Notification -->

        <div
            id="notification"
            class="hidden notification mt-6 text-center text-sm font-semibold p-3 rounded-lg"
        ></div>

    </div>


<script>

    const password = document.getElementById("password")
    const confirmPassword = document.getElementById("confirmPassword")
    const strengthBar = document.getElementById("strengthBar")
    const strengthText = document.getElementById("strengthText")
    const matchText = document.getElementById("matchText")
    const form = document.getElementById("passwordForm")
    const notification = document.getElementById("notification")
    const button = document.getElementById("submitButton")


    function checkStrength(pw) {

        let strength = 0

        if (pw.length >= 8) strength++
        if (/[A-Z]/.test(pw)) strength++
        if (/[0-9]/.test(pw)) strength++
        if (/[^A-Za-z0-9]/.test(pw)) strength++

        switch (strength) {

            case 0:
                strengthBar.style.width = "0%"
                strengthText.innerText = ""
                break

            case 1:
                strengthBar.style.width = "25%"
                strengthBar.className = "h-2 bg-red-500 rounded-full"
                strengthText.innerText = "Senha fraca"
                break

            case 2:
                strengthBar.style.width = "50%"
                strengthBar.className = "h-2 bg-yellow-500 rounded-full"
                strengthText.innerText = "Senha média"
                break

            case 3:
                strengthBar.style.width = "75%"
                strengthBar.className = "h-2 bg-blue-500 rounded-full"
                strengthText.innerText = "Senha forte"
                break

            case 4:
                strengthBar.style.width = "100%"
                strengthBar.className = "h-2 bg-green-500 rounded-full"
                strengthText.innerText = "Senha muito forte"
                break

        }

    }


    password.addEventListener("input", function () {
        checkStrength(password.value)
    })


    function checkMatch() {

        if (confirmPassword.value === "") {
            matchText.innerText = ""
            return false
        }

        if (password.value === confirmPassword.value) {

            matchText.innerText = "As senhas coincidem"
            matchText.className = "text-xs text-green-600 mt-1"
            return true

        } else {

            matchText.innerText = "As senhas não coincidem"
            matchText.className = "text-xs text-red-600 mt-1"
            return false

        }

    }


    confirmPassword.addEventListener("input", checkMatch)
    password.addEventListener("input", checkMatch)


    form.addEventListener("submit", async function (event) {

        event.preventDefault()

        if (!checkMatch()) {
            return
        }

        button.innerText = "Redefinindo..."
        button.disabled = true

        const formData = new FormData(form)

        formData.append("password", password.value)

        const response = await fetch("/users/redefine", {
            method: "POST",
            body: formData
        })

        const data = await response.json()

        notification.classList.remove("hidden")

        if (data.status === "success") {

            notification.className =
                "notification mt-6 text-center text-sm font-semibold p-3 rounded-lg bg-green-100 text-green-700"

            notification.innerText =
                "Senha redefinida com sucesso! Redirecionando..."

            setTimeout(function () {
                window.location.href = "/"
            }, 1500)

        } else {

            notification.className =
                "notification mt-6 text-center text-sm font-semibold p-3 rounded-lg bg-red-100 text-red-700"

            notification.innerText =
                data.message || "Erro ao redefinir senha"

        }

        button.innerText = "Redefinir senha"
        button.disabled = false

    })

</script>

</body>
</html>
