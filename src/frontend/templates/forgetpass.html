<!DOCTYPE html>

<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <title>DoctorFlow | Recuperar Senha</title>
    <link rel="icon" type="image/png" href="/frontend/static/assets/DoctorFlow.png">
    <script src="https://cdn.tailwindcss.com"></script>

<style>
    body {
        background: linear-gradient(135deg, #eef6ff, #ffffff);
    }

    @keyframes float {
        0% {
            transform: translateY(0px);
        }
        50% {
            transform: translateY(-10px);
        }
        100% {
            transform: translateY(0px);
        }
    }

    @keyframes slideIn {
        0% {
            opacity: 0;
            transform: translateY(-15px);
        }
        100% {
            opacity: 1;
            transform: translateY(0);
        }
    }

    .card-animation {
        animation: float 6s ease-in-out infinite;
    }

    .notification {
        animation: slideIn 0.35s ease;
    }
</style>


</head>

<body class="flex items-center justify-center min-h-screen relative">

<!-- Decorative Background -->

<div class="absolute w-96 h-96 bg-blue-200 opacity-30 blur-3xl rounded-full top-10 left-10"></div>
<div class="absolute w-96 h-96 bg-blue-300 opacity-20 blur-3xl rounded-full bottom-10 right-10"></div>

<!-- Card -->

<div class="card-animation bg-white/90 backdrop-blur-xl shadow-2xl rounded-2xl w-[420px] p-10 border border-blue-100">

    <!-- Header -->

    <div class="text-center mb-8">

        <h1 class="text-4xl font-bold text-blue-600">
            DoctorFlow
        </h1>

        <p class="text-gray-500 mt-1">
            Recuperar acesso à conta
        </p>

    </div>

    <!-- Description -->

    <p class="text-sm text-gray-500 text-center mb-6">
        Informe o email associado à sua conta e enviaremos instruções para redefinir sua senha.
    </p>

    <!-- Form -->

    <form
        id="resetForm"
        class="space-y-5"
    >

        <div>
            <label class="text-sm text-gray-600">
                Email
            </label>

            <input
                type="email"
                name="email"
                required
                placeholder="Digite seu email"
                class="w-full mt-1 border border-gray-300 rounded-lg p-3 focus:outline-none focus:ring-2 focus:ring-blue-400 transition"
            >
        </div>

        <!-- Button -->

        <button
            id="resetButton"
            type="submit"
            class="w-full bg-blue-600 text-white py-3 rounded-lg font-semibold hover:bg-blue-700 transition"
        >
            Enviar instruções
        </button>

    </form>

    <!-- Links -->

    <div class="flex justify-between text-sm mt-6">

        <a
            href="/signup"
            class="text-blue-600 hover:underline"
        >
            Criar conta
        </a>

        <a
            href="/"
            class="text-blue-600 hover:underline"
        >
            Já tenho uma conta
        </a>

    </div>

    <!-- Notification -->

    <div
        id="notification"
        class="hidden notification mt-6 text-center text-sm font-semibold p-3 rounded-lg"
    ></div>

</div>

<script>

    const form = document.getElementById("resetForm")
    const notification = document.getElementById("notification")
    const button = document.getElementById("resetButton")

    form.addEventListener("submit", async function(event) {

        event.preventDefault()

        button.innerText = "Enviando..."
        button.disabled = true

        const formData = new FormData(form)

        const response = await fetch("/users/forgot-password", {
            method: "POST",
            body: formData
        })

        const data = await response.json()

        notification.classList.remove("hidden")

        if (data.status === "success") {

            notification.className =
                "notification mt-6 text-center text-sm font-semibold p-3 rounded-lg bg-green-100 text-green-700"

            notification.innerText = "Instruções enviadas para o seu email."

        } else {

            notification.className =
                "notification mt-6 text-center text-sm font-semibold p-3 rounded-lg bg-red-100 text-red-700"

            notification.innerText = data.message || "Erro ao solicitar recuperação."

        }

        button.innerText = "Enviar instruções"
        button.disabled = false

    })

</script>

</body>
</html>
